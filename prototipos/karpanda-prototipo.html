<div id="kp-demo">
<style>
#kp-demo{--kp-bg:light-dark(#f5f7fa,#111820);--kp-surface:light-dark(#fff,#1b2530);--kp-ink:light-dark(#182630,#edf3f6);--kp-muted:light-dark(#566875,#adbdca);--kp-line:light-dark(#dce4e9,#354654);--kp-green:light-dark(#125b48,#79d9b7);--kp-tint:light-dark(#e6f3ed,#203c35);color:var(--kp-ink);font:400 14px/1.6 system-ui,sans-serif;background:var(--kp-bg);border-radius:18px;overflow:hidden}#kp-demo *{box-sizing:border-box}#kp-demo button,#kp-demo input,#kp-demo select{font:inherit}#kp-demo button{cursor:pointer}#kp-demo .kp-top{padding:22px 26px;background:var(--kp-surface);border-bottom:1px solid var(--kp-line);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}#kp-demo .kp-brand{font-size:22px;font-weight:700;letter-spacing:-1px}#kp-demo .kp-brand span{color:var(--kp-green)}#kp-demo .kp-tag{color:var(--kp-muted);font-size:12px}#kp-demo .kp-nav{display:flex;gap:6px;flex-wrap:wrap;padding:12px 24px;background:var(--kp-surface)}#kp-demo button{border:1px solid var(--kp-line);border-radius:8px;background:var(--kp-surface);color:var(--kp-ink);padding:9px 13px}#kp-demo button[aria-pressed=true],#kp-demo .kp-primary{background:var(--kp-green);color:var(--kp-bg);border-color:var(--kp-green)}#kp-demo .kp-main{padding:30px}#kp-demo h1{font-size:32px;line-height:1.18;letter-spacing:-1px;margin:8px 0 14px;font-weight:700}#kp-demo h2{font-size:21px;line-height:1.3;margin:0 0 12px}#kp-demo h3{font-size:16px;margin:0 0 9px}#kp-demo p{margin:8px 0 18px}#kp-demo .kp-muted{color:var(--kp-muted)}#kp-demo .kp-kicker{color:var(--kp-green);font-size:12px;letter-spacing:1.4px;text-transform:uppercase;font-weight:600}#kp-demo .kp-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}#kp-demo .kp-two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px}#kp-demo .kp-box{padding:22px;border:1px solid var(--kp-line);border-radius:12px;background:var(--kp-surface);min-width:0}#kp-demo .kp-hero{padding:28px 0 32px;max-width:660px}#kp-demo .kp-preview{height:115px;background:var(--kp-tint);border-radius:8px;margin-bottom:18px;padding:16px;display:flex;gap:8px;align-items:end}#kp-demo .kp-preview span{background:var(--kp-green);opacity:.65;width:20%;border-radius:4px 4px 0 0}#kp-demo .kp-price{font-size:25px;font-weight:650;margin:14px 0}#kp-demo .kp-pill{display:inline-block;padding:3px 9px;border-radius:20px;background:var(--kp-tint);color:var(--kp-green);font-size:12px}#kp-demo .kp-row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}#kp-demo .kp-list{padding-left:20px;margin:12px 0 22px}#kp-demo .kp-list li{margin:8px 0}#kp-demo label{display:block;margin:14px 0}#kp-demo input,#kp-demo select{width:100%;padding:10px;border:1px solid var(--kp-line);border-radius:7px;background:var(--kp-bg);color:var(--kp-ink);margin-top:5px}#kp-demo .kp-flow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0}#kp-demo .kp-node{background:var(--kp-tint);padding:12px 15px;border-radius:7px}#kp-demo .kp-divider{border:0;border-top:1px solid var(--kp-line);margin:22px 0}#kp-demo .kp-table{width:100%;border-collapse:collapse}#kp-demo .kp-table th,#kp-demo .kp-table td{text-align:left;border-bottom:1px solid var(--kp-line);padding:12px 5px;overflow-wrap:anywhere}#kp-demo .kp-foot{padding:16px 26px;border-top:1px solid var(--kp-line);color:var(--kp-muted);font-size:12px}#kp-demo .kp-toast{padding:12px 18px;background:var(--kp-tint);color:var(--kp-green);margin-bottom:18px;border-radius:8px}#kp-demo button:focus-visible{outline:3px solid var(--kp-green);outline-offset:3px}@media(max-width:700px){#kp-demo .kp-grid,#kp-demo .kp-two{grid-template-columns:1fr}#kp-demo .kp-main{padding:20px}#kp-demo h1{font-size:27px}#kp-demo .kp-top{padding:18px}#kp-demo .kp-nav{padding:12px}#kp-demo .kp-table{font-size:12px}}
</style>
<header class="kp-top"><div class="kp-brand">kar<span>panda</span><div class="kp-tag">Software que impulsa tu negocio</div></div><span class="kp-pill">Prototipo conceptual · datos de ejemplo</span></header>
<nav class="kp-nav" aria-label="Pantallas del prototipo"><button data-page="catalogo" aria-pressed="true">Catálogo</button><button data-page="producto" aria-pressed="false">Producto</button><button data-page="compra" aria-pressed="false">Compra</button><button data-page="cliente" aria-pressed="false">Mi cuenta</button><button data-page="admin" aria-pressed="false">Administración</button><button data-page="planos" aria-pressed="false">Planos</button></nav>
<main class="kp-main" id="kp-content"></main><footer class="kp-foot">Karpanda / Propuesta comercial de software · Productos, precios y métricas ilustrativos. Compra y descargas simuladas.</footer>
<script>
(()=>{const root=document.getElementById('kp-demo'),out=root.querySelector('#kp-content');const products=[{name:'Karpanda Ventas',type:'Ventas e inventario',price:199,desc:'Controla tu caja, productos y ventas desde un solo lugar.'},{name:'Karpanda Reservas',type:'Citas y servicios',price:149,desc:'Organiza tu agenda y administra las reservas de tus clientes.'},{name:'Karpanda Gestión',type:'Operación de negocios',price:249,desc:'Centraliza clientes, tareas y reportes de tu empresa.'}];let state={page:'catalogo',product:0,paid:false,...(window.openai?.widgetState?.privateContent||{})};if(!products[state.product])state.product=0;const allowed=['catalogo','producto','compra','cliente','admin','planos'];if(!allowed.includes(state.page))state.page='catalogo';const money=n=>'S/ '+n.toFixed(2);const preview='<div class="kp-preview" aria-label="Vista esquemática del software"><span style="height:35%"></span><span style="height:65%"></span><span style="height:52%"></span><span style="height:90%"></span></div>';function save(){window.openai?.setWidgetState({modelContent:{pantalla:state.page,producto:products[state.product].name,compraSimulada:state.paid},privateContent:state})?.catch(()=>{});}function render(){let p=products[state.product];root.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.page===state.page)));let html='';switch(state.page){case 'catalogo':html=`<div class="kp-hero"><div class="kp-kicker">Software para empresas</div><h1>Tu próximo paso empieza<br>con el software correcto.</h1><p class="kp-muted">Soluciones listas para simplificar tu negocio. Explora sus funciones y elige la que mejor se adapte a ti.</p></div><div class="kp-row"><h2>Encuentra tu solución</h2><span class="kp-muted">3 productos de demostración</span></div><div class="kp-grid">${products.map((x,i)=>`<article class="kp-box">${preview}<span class="kp-pill">${x.type}</span><h3 style="margin-top:14px">${x.name}</h3><p class="kp-muted">${x.desc}</p><div class="kp-price">${money(x.price)} <small class="kp-tag">/ mes</small></div><button data-product="${i}">Ver software →</button></article>`).join('')}</div>`;break;case 'producto':html=`<div class="kp-kicker">Catálogo / ${p.type}</div><h1>${p.name}</h1><div class="kp-two"><section class="kp-box">${preview}<h2>Menos tareas repetitivas.<br>Más tiempo para crecer.</h2><p class="kp-muted">${p.desc}</p><h3>Qué incluye</h3><ul class="kp-list"><li>Acceso al sistema desde el navegador</li><li>Reportes y exportación de información</li><li>Administración de usuarios y permisos</li><li>Actualizaciones y soporte durante la suscripción</li></ul><span class="kp-pill">Vista del producto propuesta</span></section><aside class="kp-box"><h2>Plan Empresa</h2><p class="kp-muted">Suscripción mensual ilustrativa</p><div class="kp-price">${money(p.price)} / mes</div><p>1 empresa · hasta 5 usuarios</p><button class="kp-primary" data-go="compra">Elegir este plan</button><hr class="kp-divider"><p class="kp-muted">La ficha final debe especificar requisitos, límites, soporte, impuestos y condiciones de cancelación.</p></aside></div>`;break;case 'compra':html=`<div class="kp-kicker">Paso 2 / Revisión de compra</div><h1>Comienza con ${p.name}</h1><form id="kp-checkout" class="kp-two"><section class="kp-box"><h2>Datos del comprador</h2><label>Nombre o empresa<input name="customer" required placeholder="Ej. Mi empresa"></label><label>Correo de acceso<input name="email" type="email" required placeholder="nombre@empresa.com"></label><label>Modalidad<select name="mode"><option>Suscripción mensual</option></select></label><p class="kp-muted">Entorno de demostración. No se solicitan datos bancarios.</p></section><aside class="kp-box"><h2>Resumen del pedido</h2><p>${p.name} · Plan Empresa</p><div class="kp-row"><span>Precio mensual de ejemplo</span><strong>${money(p.price)}</strong></div><hr class="kp-divider"><p class="kp-muted">Importes e impuestos definitivos por definir. Una compra real se confirmará después de verificar el pago.</p><button class="kp-primary" type="submit">Simular compra</button></aside></form>`;break;case 'cliente':html=`${state.paid?'<div class="kp-toast" role="status">Compra simulada completada. Tu suscripción de ejemplo está disponible.</div>':''}<div class="kp-kicker">Área del cliente</div><h1>Tu software, en un solo lugar.</h1><div class="kp-two"><section class="kp-box"><div class="kp-row"><h2>${p.name}</h2><span class="kp-pill">${state.paid?'Activo · demostración':'Suscripción de ejemplo'}</span></div><p class="kp-muted">Plan Empresa · renovación mensual</p><p>Licencia: DEMO-KARPANDA-0001</p><button class="kp-primary" data-action="access">Abrir mi software</button> <button data-action="download">Descargas</button><hr class="kp-divider"><h3>Soporte y actualizaciones</h3><p class="kp-muted">Consulta la documentación o solicita ayuda sobre tu producto.</p><button data-action="support">Solicitar soporte</button></section><aside class="kp-box"><h2>Mis pedidos</h2><p>Pedido DEMO-001</p><p>${p.name}</p><strong>${money(p.price)}</strong><p class="kp-muted">${state.paid?'Pago simulado':'Registro de ejemplo'}</p></aside></div><p id="kp-feedback" role="status"></p>`;break;case 'admin':html=`<div class="kp-kicker">Administración / Datos de demostración</div><h1>Gestiona tu tienda de software.</h1><section class="kp-box"><div class="kp-row"><h2>Productos publicados</h2><span class="kp-pill">3 productos de ejemplo</span></div><table class="kp-table"><thead><tr><th>Producto</th><th>Plan mensual</th><th>Estado</th></tr></thead><tbody>${products.map(x=>`<tr><td>${x.name}</td><td>${money(x.price)}</td><td>Publicado</td></tr>`).join('')}</tbody></table></section><div class="kp-grid" style="margin-top:18px"><section class="kp-box"><h3>Pedidos</h3><p class="kp-muted">Revisar pagos confirmados, pendientes y reembolsos.</p></section><section class="kp-box"><h3>Licencias</h3><p class="kp-muted">Consultar activaciones, vencimientos y accesos.</p></section><section class="kp-box"><h3>Clientes y soporte</h3><p class="kp-muted">Administrar cuentas y atender solicitudes.</p></section></div>`;break;case 'planos':html=`<div class="kp-kicker">Diseño del sistema / Propuesta por validar</div><h1>De descubrir a activar.</h1><h2>Recorrido de venta</h2><div class="kp-flow"><span class="kp-node">Catálogo</span>→<span class="kp-node">Producto y plan</span>→<span class="kp-node">Registro / acceso</span>→<span class="kp-node">Pago verificado</span>→<span class="kp-node">Licencia o suscripción</span>→<span class="kp-node">Acceso y soporte</span></div><hr class="kp-divider"><h2>Arquitectura propuesta</h2><div class="kp-grid"><section class="kp-box"><h3>Presentación</h3><p>Tienda pública<br>Portal del cliente<br>Panel de administración</p></section><section class="kp-box"><h3>Aplicación</h3><p>Autenticación y permisos<br>Catálogo y pedidos<br>Pagos y licencias<br>Soporte y notificaciones</p></section><section class="kp-box"><h3>Datos e integraciones</h3><p>Base de datos relacional<br>Pasarela de pagos<br>Archivos privados<br>Servicio de correo</p></section></div><hr class="kp-divider"><h2>Relaciones principales</h2><div class="kp-flow"><span class="kp-node">Cliente 1 → N Pedidos</span><span class="kp-node">Pedido 1 → N Detalles</span><span class="kp-node">Producto 1 → N Planes</span><span class="kp-node">Detalle N → 1 Plan</span><span class="kp-node">Pedido 1 → N Intentos de pago</span><span class="kp-node">Detalle 1 → 0..1 Licencia</span></div><p class="kp-muted">La licencia se emite una sola vez al verificar el pago. Un pago fallido mantiene el pedido pendiente; no habilita el producto.</p>`;break;}out.innerHTML=html;}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page||b.dataset.go){state.page=b.dataset.page||b.dataset.go;render();save();}if(b.dataset.product!==undefined){state.product=Number(b.dataset.product);state.page='producto';render();save();}if(b.dataset.action){const messages={access:'Demostración: aquí se abriría el software adquirido después de validar la licencia.',download:'Demostración: aquí aparecerían instaladores y versiones autorizadas, si el producto es descargable.',support:'Demostración: aquí se abriría un ticket asociado al producto y a tu cuenta.'};out.querySelector('#kp-feedback').textContent=messages[b.dataset.action];}});root.addEventListener('submit',e=>{if(e.target.id==='kp-checkout'){e.preventDefault();state.paid=true;state.page='cliente';render();save();}});window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent;if(s&&allowed.includes(s.page)&&products[s.product]){state={...state,...s};render();}});render();})();
</script>
</div>
